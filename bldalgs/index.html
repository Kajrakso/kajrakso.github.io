<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>bldalgs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/umd/supabase.min.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <div id="tab-buttons">
        <button class="tab-button" data-tab="Corners" onclick="showTab(`Corners`)">Corners</button>
        <button class="tab-button" data-tab="Edges" onclick="showTab(`Edges`)">Edges</button>
        <button class="tab-button" data-tab="Wings" onclick="showTab(`Wings`)">Wings</button>
        <button class="tab-button" data-tab="LTCT" onclick="showTab(`LTCT`)">LTCT</button>
    </div>

    <button id="signout-btn" onclick="signOut()">sign out</button>

    <div id="tabs-content">
        <div style="display:none;" class="tab-content" id="Corners"></div>
        <div style="display:none;" class="tab-content" id="Edges"></div>
        <div style="display:none;" class="tab-content" id="Wings"></div>
        <div style="display:none;" class="tab-content" id="LTCT"></div>
    </div>

    <button id="admin-dot" onclick="openLogin()">Log in</button>

    <div id="login-overlay" class="overlay" onclick="closeLogin()">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeLogin()">&times;</button>
            <h2>Sign In</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" id="login-submit">Sign In</button>
                <div id="login-error"></div>
            </form>
        </div>
    </div>

    <div id="add-overlay" class="overlay" onclick="closeAddModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeAddModal()">&times;</button>
            <h2 id="add-modal-title">Add Algorithm</h2>
            <form id="add-form" onsubmit="handleAdd(event)">
                <div id="add-fields"></div>
                <input type="text" id="add-alg" placeholder="Algorithm" required>
                <button type="submit">Add</button>
                <div id="add-error"></div>
            </form>
        </div>
    </div>

</body>
</html>
